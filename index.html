
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080d1b" />
    <title>OTP Verification Portal</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #080d1b;
        color: #f8fafc;
        font-family: Arial, sans-serif;
      }

      #root {
        min-height: 100vh;
      }

      .startup {
        min-height: 100vh;
        display: grid;
        place-content: center;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }

      .startup h1 {
        color: #818cf8;
      }

      .startup p {
        color: #94a3b8;
      }

      .startup button {
        padding: 12px 20px;
        background: #6366f1;
        color: white;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <main class="startup">
        <h1>OTP Verification</h1>
        <p>Starting your secure authentication portal...</p>
        <p>If this message remains, check the application files.</p>
        <button onclick="location.reload()">Reload Application</button>
      </main>
    </div>

    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
